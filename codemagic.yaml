
workflows:
  voxflow-android:
    name: VOXFLOW Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Locate Android project
        script: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "Project found in $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
