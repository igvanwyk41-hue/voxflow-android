workflows:
  voxflow-android:
    name: VOXFLOW Android Build
    max_build_duration: 60
    instance_type: linux

    environment:
      java: 17

    scripts:
      - name: Build Android APK
        script: |
          echo "Checking Android project..."
          ls -la
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found"
            exit 1
          fi

    artifacts:
      - "**/build/outputs/apk/debug/*.apk"